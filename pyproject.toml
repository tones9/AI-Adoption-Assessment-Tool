[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-adoption-engine"
version = "0.3.0"
description = "Explainable decision support for process-level AI adoption opportunities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "charset-normalizer>=3.4,<4",
  "pydantic>=2.7,<3",
  "pypdf>=6.14,<7",
]

[project.optional-dependencies]
openai = [
  "openai>=2.47,<3",
]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
ai-adoption-engine = "ai_adoption_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
